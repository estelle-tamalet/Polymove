services:
  postgres:
    image: postgres:15
    container_name: polytech-postgres
    restart: always
    networks:
      - polymove-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polymove_polytech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:7
    container_name: erasmumu-mongo
    restart: always
    networks:
      - polymove-network
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  polytech:
    build: ./polytech
    container_name: polytech-server
    restart: always
    networks:
      - polymove-network
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: polymove_polytech
    depends_on:
      - postgres

  erasmumu:
    build: ./erasmumu
    container_name: erasmumu-server
    restart: always
    networks:
      - polymove-network
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/erasmumu
    depends_on:
      - mongo

volumes:
  postgres_data:
  mongo_data:

networks:
  polymove-network:
    driver: bridge
