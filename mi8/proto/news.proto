syntax = "proto3";

package mi8;

service NewsService {
  rpc GetLatestNews (LimitRequest) returns (NewsList);
  rpc GetLatestNewsInCity (CityRequest) returns (NewsList);
  rpc CreateNews (News) returns (Empty);
  rpc GetCityScore (CityScoreRequest) returns (CityScoreResponse);
  rpc GetTopCities (LimitRequest) returns (CityScoreList);
  rpc GetCityStats (CityStatsRequest) returns (CityStatsResponse);
}

message News {
  string id = 1;
  string title = 2;
  string city = 3;
  string country = 4;
  string content = 5;
  int64 createdAt = 6;
  repeated string tags = 7;
}

message LimitRequest {
  int32 limit = 1;
}

message CityRequest {
  string city = 1;
  int32 limit = 2;
}

message NewsList {
  repeated News news = 1;
}

message CityScoreRequest {
  string city = 1;
}

message CityScoreResponse {
  CityScore score = 1;
}

message CityScoreList {
  repeated CityScore scores = 1;
}

message CityScore {
  string city = 1;
  int32 safety = 2;
  int32 economy = 3;
  int32 qualityOfLife = 4;
  int32 culture = 5;
  int64 lastUpdated = 6;
  int32 totalScore = 7;
}

message CityStatsRequest {
  string city = 1;
}

message CityStatsResponse {
  CityStats stats = 1;
}

message CityStats {
  string city = 1;
  int32 totalOffers = 2;
  map<string, int32> offersByDomain = 3;
  int64 lastOfferDate = 4;
}

message Empty {}
